name: Android APK
on:
  push:
    paths:
      - 'mobile/**'
      - 'scripts/configure_android.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: Public HTTPS API URL for a release APK (leave blank for emulator debug APK)
        required: false
        type: string
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android platform
        run: |
          if [ ! -f mobile/android/gradlew ]; then
            flutter create --platforms=android --org=id.campah --project-name=campah_mobile --no-pub mobile
          fi
          python scripts/configure_android.py
      - name: Resolve packages and analyze
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build APK
        working-directory: mobile
        env:
          CAMPAH_API_URL: ${{ inputs.api_url || vars.CAMPAH_API_URL }}
        run: |
          if [ -n "$CAMPAH_API_URL" ]; then
            case "$CAMPAH_API_URL" in https://*) ;; *) echo 'Release API URL must use HTTPS'; exit 1 ;; esac
            flutter build apk --release --dart-define="API_URL=$CAMPAH_API_URL"
          else
            flutter build apk --debug --dart-define=API_URL=http://10.0.2.2:8000
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: campah-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
