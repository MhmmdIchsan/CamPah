name: Checks
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API dependencies without ML runtime
        run: |
          python -c "from pathlib import Path; print('\n'.join(line for line in Path('api/requirements.txt').read_text().splitlines() if not line.startswith(('torch', 'torchvision'))))" > /tmp/api-requirements.txt
          pip install -r /tmp/api-requirements.txt
      - run: python -m pytest api/tests -q
      - name: Check PostgreSQL migration
        working-directory: api
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/campah_test
        run: |
          python -m alembic upgrade head
          python -m alembic check
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API dependencies for browser integration
        working-directory: .
        run: |
          python -c "from pathlib import Path; print('\n'.join(line for line in Path('api/requirements.txt').read_text().splitlines() if not line.startswith(('torch', 'torchvision'))))" > /tmp/api-requirements.txt
          pip install -r /tmp/api-requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
